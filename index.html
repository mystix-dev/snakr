<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DamnBruh Clone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">DAMNBRUH</div>
  <button class="login-btn">Login</button>
</header>

<main class="grid">

  <!-- Leaderboard -->
  <section class="card">
    <h3>🏆 Leaderboard</h3>
    <ul class="list">
      <li>1. terrorist — $16,434.61</li>
      <li>2. glx_duolingo — $15,875.29</li>
      <li>3. halfpriceofM3 — $13,653.13</li>
    </ul>
    <button class="btn">View Full Leaderboard</button>
  </section>

  <!-- Game Join -->
  <section class="card main-card">
    <h2>Login to set your name</h2>

    <div class="bet-row">
      <button class="bet">$1</button>
      <button class="bet">$5</button>
      <button class="bet">$20</button>
    </div>

    <button class="join-btn">▶ JOIN GAME</button>

    <div class="stats">
      <div>40<br><span>Players in Game</span></div>
      <div>$1,300,784<br><span>Global Player Winnings</span></div>
    </div>

    <button class="btn full">Manage Affiliate</button>
  </section>

  <!-- Wallet -->
  <section class="card">
    <h3>💼 Wallet</h3>
    <h1>$0.00</h1>
    <div class="wallet-btns">
      <button class="btn green">Add Funds</button>
      <button class="btn blue">Cash Out</button>
    </div>
  </section>

  <!-- Friends -->
  <section class="card">
    <h3>👥 Friends</h3>
    <p>No friends... add some!</p>
    <button class="btn">Add Friends</button>
  </section>

  <!-- Customize -->
  <section class="card">
    <h3>🎨 Customize</h3>
    <div class="worm"></div>
    <button class="btn">Change Appearance</button>
  </section>

</main>

<footer>
  <button class="discord">Join Discord</button>
</footer>

<script src="script.js"></script>
</body>
</html>
